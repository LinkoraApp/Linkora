name: Windows Master Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64-native:
    name: Build Windows x64 Native
    runs-on: windows-2022
    steps:
      - name: Configure Git for Windows
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Read Rust Toolchain Version
        id: rust-toolchain
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: web-capture/rust-toolchain.toml
          field: toolchain.channel
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.value }}
          targets: x86_64-pc-windows-msvc
      - name: Set RUSTFLAGS
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=$HOME/.cargo=.cargo" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-capture -> target
          shared-key: ci-rust-windows-x64
      - name: Install Strawberry Perl and NASM
        shell: pwsh
        run: |
          choco install strawberryperl nasm -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Strawberry\perl\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
          Add-Content -Path $env:GITHUB_ENV -Value "PERL=C:\Strawberry\perl\bin\perl.exe"
      - name: Clean stale OpenSSL build cache
        shell: bash
        run: |
          cd web-capture
          cargo clean -p openssl-sys || true
          rm -rf target/x86_64-pc-windows-msvc/release/build/openssl-sys-*
      - name: Build Windows x64 native library
        shell: pwsh
        run: |
          .\gradlew.bat :web-capture:cargoBuildDesktop -PdesktopRustTarget=x86_64-pc-windows-msvc
          $expected = "web-capture\build\rustLibs\desktop\windows-x64\web_capture.dll"
          if (!(Test-Path $expected)) { throw "Windows x64 native library was not built at expected path: $expected" }
      - name: Upload Windows x64 native library
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-native
          path: web-capture/build/rustLibs/desktop/windows-x64/web_capture.dll
          if-no-files-found: error

  build-windows-arm64-native:
    name: Build Windows ARM64 Native
    runs-on: windows-2022
    steps:
      - name: Configure Git for Windows
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Read Rust Toolchain Version
        id: rust-toolchain
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: web-capture/rust-toolchain.toml
          field: toolchain.channel
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.value }}
          targets: aarch64-pc-windows-msvc
      - name: Configure MSVC ARM64 cross compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Set RUSTFLAGS
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=$HOME/.cargo=.cargo" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-capture -> target
          shared-key: ci-rust-windows-arm64
      - name: Install Strawberry Perl and NASM
        shell: pwsh
        run: |
          choco install strawberryperl nasm -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Strawberry\perl\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
          Add-Content -Path $env:GITHUB_ENV -Value "PERL=C:\Strawberry\perl\bin\perl.exe"
      - name: Clean stale OpenSSL build cache
        shell: bash
        run: |
          cd web-capture
          cargo clean -p openssl-sys || true
          rm -rf target/aarch64-pc-windows-msvc/release/build/openssl-sys-*
      - name: Build Windows ARM64 native library
        shell: pwsh
        run: |
          .\gradlew.bat :web-capture:cargoBuildDesktop -PdesktopRustTarget=aarch64-pc-windows-msvc
          $expected = "web-capture\build\rustLibs\desktop\windows-arm64\web_capture.dll"
          if (!(Test-Path $expected)) { throw "Windows ARM64 native library was not built at expected path: $expected" }
      - name: Upload Windows ARM64 native library
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-native
          path: web-capture/build/rustLibs/desktop/windows-arm64/web_capture.dll
          if-no-files-found: error

  package-windows-x64:
    name: Package Windows x64
    needs: build-windows-x64-native
    runs-on: windows-2022
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Download x64 native library
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-native
          path: web-capture/build/rustLibs/desktop/windows-x64
      - name: Package Windows x64
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe -x :web-capture:cargoBuildDesktop
      - name: Verify x64 packages
        shell: pwsh
        run: |
          $msi = Get-ChildItem composeApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          $exe = Get-ChildItem composeApp/build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          if (!$msi) { throw "Windows x64 MSI was not produced" }
          if (!$exe) { throw "Windows x64 EXE was not produced" }
          $msiExtract = "$env:GITHUB_WORKSPACE\msi-x64-extract"
          New-Item -ItemType Directory -Force $msiExtract | Out-Null
          Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$msiExtract`"" -Wait -NoNewWindow
          $msiFound = Get-ChildItem -Path $msiExtract -Recurse -Filter web_capture.dll |  Where-Object { $_.FullName -match '[\\/]resources[\\/]windows-x64[\\/]web_capture\.dll$' } |  Select-Object -First 1
          if (!$msiFound) { Get-ChildItem -Recurse $msiExtract | Select-Object -ExpandProperty FullName; throw "Windows x64 MSI does not contain app/resources/windows-x64/web_capture.dll" }
          $exeExtract = "$env:GITHUB_WORKSPACE\exe-x64-extract"
          New-Item -ItemType Directory -Force $exeExtract | Out-Null
          & 7z x "$($exe.FullName)" -o"$exeExtract" -y | Out-Null
          $exeFound = Get-ChildItem -Path $exeExtract -Recurse -Filter web_capture.dll | Where-Object { $_.FullName -match '[\\/]resources[\\/]windows-x64[\\/]web_capture\.dll$' } | Select-Object -First 1
          if (!$exeFound) { Get-ChildItem -Recurse $exeExtract | Select-Object -ExpandProperty FullName; throw "Windows x64 EXE does not contain app/resources/windows-x64/web_capture.dll" }
          Write-Host "MSI: $($msiFound.FullName)"
          Write-Host "EXE: $($exeFound.FullName)"
      - name: Upload Windows x64 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  package-windows-arm64:
    name: Package Windows ARM64
    needs: build-windows-arm64-native
    runs-on: windows-11-arm
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Download ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-native
          path: web-capture/build/rustLibs/desktop/windows-arm64
      - name: Package Windows ARM64
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe -x :web-capture:cargoBuildDesktop
      - name: Verify ARM64 packages
        shell: pwsh
        run: |
          $msi = Get-ChildItem composeApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          $exe = Get-ChildItem composeApp/build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          if (!$msi) { throw "Windows ARM64 MSI was not produced" }
          if (!$exe) { throw "Windows ARM64 EXE was not produced" }
          $msiExtract = "$env:GITHUB_WORKSPACE\msi-arm64-extract"
          New-Item -ItemType Directory -Force $msiExtract | Out-Null
          Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$msiExtract`"" -Wait -NoNewWindow
          $msiFound = Get-ChildItem -Path $msiExtract -Recurse -Filter web_capture.dll | Where-Object { $_.FullName -match '[\\/]resources[\\/]windows-arm64[\\/]web_capture\.dll$' } | Select-Object -First 1
          if (!$msiFound) { Get-ChildItem -Recurse $msiExtract | Select-Object -ExpandProperty FullName; throw "Windows ARM64 MSI does not contain app/resources/windows-arm64/web_capture.dll" }
          $exeExtract = "$env:GITHUB_WORKSPACE\exe-arm64-extract"
          New-Item -ItemType Directory -Force $exeExtract | Out-Null
          & 7z x "$($exe.FullName)" -o"$exeExtract" -y | Out-Null
          $exeFound = Get-ChildItem -Path $exeExtract -Recurse -Filter web_capture.dll | Where-Object { $_.FullName -match '[\\/]resources[\\/]windows-arm64[\\/]web_capture\.dll$' } | Select-Object -First 1
          if (!$exeFound) { Get-ChildItem -Recurse $exeExtract | Select-Object -ExpandProperty FullName; throw "Windows ARM64 EXE does not contain app/resources/windows-arm64/web_capture.dll" }
          Write-Host "MSI: $($msiFound.FullName)"
          Write-Host "EXE: $($exeFound.FullName)"
      - name: Upload Windows ARM64 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-build
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
