name: Build and Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to'
        required: true

env:
  RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=${{ env.HOME }}/.cargo=.cargo"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop Platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          autocrlf: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Read Rust Toolchain Version
        id: rust-toolchain
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: 'web-capture/rust-toolchain.toml'
          field: 'toolchain.channel'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.value }}
          targets: ${{ matrix.rust-target }}

      - name: Verify Rust Version
        run: |
          rustc --version
          cargo --version
          echo "--- Content of rust-toolchain.toml ---"
          cat web-capture/rust-toolchain.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web-capture -> target"
          shared-key: "release-rust-${{ matrix.os }}"

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: .\gradlew :composeApp:packageMsi :composeApp:packageExe

      - name: Build Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :composeApp:packageDeb :composeApp:packageUberJarForCurrentOS

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p AppDir/usr/bin
          cp composeApp/build/compose/jars/Linkora-linux-x64-*.jar AppDir/usr/bin/

          cat << 'EOF' > AppDir/AppRun
          #!/bin/bash
          JAR_FILE=$(ls "$APPDIR/usr/bin/"*.jar | head -n 1)
          exec java -jar "$JAR_FILE"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/linkora.desktop
          [Desktop Entry]
          Categories=Utility;
          Exec=AppRun
          Icon=linkora
          Name=Linkora
          Terminal=false
          Type=Application
          EOF

          cp fastlane/metadata/android/en-US/images/icon.png AppDir/linkora.png

          wget -qO appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          UPDATE_INFO="gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Linkora.AppImage.zsync"

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run -u "$UPDATE_INFO" AppDir Linkora.AppImage

      - name: Upload Desktop Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            composeApp/build/compose/binaries/main/exe/*.exe
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/jars/*.jar
            Linkora.AppImage
            Linkora.AppImage.zsync

  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Android SDK & Install NDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystores
        run: |
          echo "${{ secrets.PREVIEW_KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/preview_keystore.jks
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/release_keystore.jks

      - name: Build and Sign Preview APKs
        env:
          STORE_PASSWORD: ${{ secrets.PREVIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assemblePreview \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/preview_keystore.jks \
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          
          mkdir -p preview-apks
          mv composeApp/build/outputs/apk/preview/*-arm64-v8a-preview.apk preview-apks/Linkora-arm64-v8a-preview.apk
          mv composeApp/build/outputs/apk/preview/*-armeabi-v7a-preview.apk preview-apks/Linkora-armeabi-v7a-preview.apk
          mv composeApp/build/outputs/apk/preview/*-x86_64-preview.apk preview-apks/Linkora-x86_64-preview.apk
          mv composeApp/build/outputs/apk/preview/*-universal-preview.apk preview-apks/Linkora-universal-preview.apk

      - name: Build and Sign Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release_keystore.jks \
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          
          mkdir -p release-apks
          mv composeApp/build/outputs/apk/release/*-arm64-v8a-release.apk release-apks/Linkora-arm64-v8a-release.apk
          mv composeApp/build/outputs/apk/release/*-armeabi-v7a-release.apk release-apks/Linkora-armeabi-v7a-release.apk
          mv composeApp/build/outputs/apk/release/*-x86_64-release.apk release-apks/Linkora-x86_64-release.apk
          mv composeApp/build/outputs/apk/release/*-universal-release.apk release-apks/Linkora-universal-release.apk

      - name: Upload Android Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            preview-apks/*.apk
            release-apks/*.apk

  build-wasm:
    name: Build WasmJs Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build WasmJs Extension Zip
        run: |
          ./gradlew :composeApp:wasmJsBrowserDistribution
          cd composeApp/build/dist/wasmJs/productionExecutable
          zip -r $GITHUB_WORKSPACE/Linkora-web-wasm.zip .

      - name: Upload Web Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            Linkora-web-wasm.zip

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy \
          --dir=composeApp/build/dist/wasmJs/productionExecutable \
          --prod \
          --message "Production deploy for tag ${{ inputs.tag }}"