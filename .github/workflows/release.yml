name: Build and Release Binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to'
        required: true

permissions:
  contents: write

jobs:
  package-windows-x64:
    name: Package Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Package Windows x64
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe

      - name: Rename Windows x64 artifacts
        shell: pwsh
        run: |
          Get-ChildItem composeApp/build/compose/binaries/main/exe/*.exe | ForEach-Object {
            Rename-Item $_.FullName -NewName "$($_.BaseName)-windows-x64$($_.Extension)"
          }
          Get-ChildItem composeApp/build/compose/binaries/main/msi/*.msi | ForEach-Object {
            Rename-Item $_.FullName -NewName "$($_.BaseName)-windows-x64$($_.Extension)"
          }

      - name: Verify Windows x64 artifacts
        shell: pwsh
        run: |
          if (!(Get-ChildItem composeApp/build/compose/binaries/main/exe/*-windows-x64.exe)) {
            throw "Windows x64 EXE missing"
          }
          if (!(Get-ChildItem composeApp/build/compose/binaries/main/msi/*-windows-x64.msi)) {
            throw "Windows x64 MSI missing"
          }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            composeApp/build/compose/binaries/main/exe/*-windows-x64.exe
            composeApp/build/compose/binaries/main/msi/*-windows-x64.msi

  package-windows-arm64:
    name: Package Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Package Windows ARM64
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe

      - name: Rename Windows ARM64 artifacts
        shell: pwsh
        run: |
          Get-ChildItem composeApp/build/compose/binaries/main/exe/*.exe | ForEach-Object {
            Rename-Item $_.FullName -NewName "$($_.BaseName)-windows-arm64$($_.Extension)"
          }
          Get-ChildItem composeApp/build/compose/binaries/main/msi/*.msi | ForEach-Object {
            Rename-Item $_.FullName -NewName "$($_.BaseName)-windows-arm64$($_.Extension)"
          }

      - name: Verify Windows ARM64 artifacts
        shell: pwsh
        run: |
          if (!(Get-ChildItem composeApp/build/compose/binaries/main/exe/*-windows-arm64.exe)) {
            throw "Windows ARM64 EXE missing"
          }
          if (!(Get-ChildItem composeApp/build/compose/binaries/main/msi/*-windows-arm64.msi)) {
            throw "Windows ARM64 MSI missing"
          }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            composeApp/build/compose/binaries/main/exe/*-windows-arm64.exe
            composeApp/build/compose/binaries/main/msi/*-windows-arm64.msi

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Linux packages
        run: ./gradlew :composeApp:packageDeb :composeApp:packageUberJarForCurrentOS

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp composeApp/build/compose/jars/Linkora-linux-x64-*.jar AppDir/usr/bin/

          cat << 'EOF' > AppDir/AppRun
          #!/bin/bash
          JAR_FILE=$(ls "$APPDIR/usr/bin/"*.jar | head -n 1)
          exec java -jar "$JAR_FILE"
          EOF

          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/linkora.desktop
          [Desktop Entry]
          Categories=Utility;
          Exec=AppRun
          Icon=linkora
          Name=Linkora
          Terminal=false
          Type=Application
          EOF

          cp fastlane/metadata/android/en-US/images/icon.png AppDir/linkora.png
          wget -qO appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          UPDATE_INFO="gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Linkora.AppImage.zsync"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run -u "$UPDATE_INFO" AppDir Linkora.AppImage

      - name: Verify Linux DEB
        run: |
          deb=$(ls composeApp/build/compose/binaries/main/deb/*.deb | head -n 1)
          test -n "$deb"

      - name: Verify AppImage
        run: |
          chmod +x Linkora.AppImage
          ./Linkora.AppImage --appimage-extract >/dev/null 2>&1
          test -f squashfs-root/AppRun

      - name: Bundle Linux portable jar
        run: |
          mkdir -p linkora-linux-portable
          jar=$(ls composeApp/build/compose/jars/Linkora-linux-x64-*.jar | head -n 1)
          cp "$jar" linkora-linux-portable/
          printf 'run from the extracted directory:\njava -jar %s\n' "$(basename "$jar")" > linkora-linux-portable/README.txt
          (cd linkora-linux-portable && zip -r "$GITHUB_WORKSPACE/Linkora-linux-x64-portable.zip" .)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            composeApp/build/compose/binaries/main/deb/*.deb
            Linkora-linux-x64-portable.zip
            Linkora.AppImage
            Linkora.AppImage.zsync

  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystores
        run: |
          echo "${{ secrets.PREVIEW_KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/preview_keystore.jks
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/release_keystore.jks

      - name: Build and Sign Preview APKs
        env:
          STORE_PASSWORD: ${{ secrets.PREVIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assemblePreview \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/preview_keystore.jks \
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          mkdir -p preview-apks
          mv composeApp/build/outputs/apk/preview/*-arm64-v8a-preview.apk preview-apks/Linkora-arm64-v8a-preview.apk
          mv composeApp/build/outputs/apk/preview/*-armeabi-v7a-preview.apk preview-apks/Linkora-armeabi-v7a-preview.apk
          mv composeApp/build/outputs/apk/preview/*-x86_64-preview.apk preview-apks/Linkora-x86_64-preview.apk
          mv composeApp/build/outputs/apk/preview/*-universal-preview.apk preview-apks/Linkora-universal-preview.apk

      - name: Build and Sign Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release_keystore.jks \
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          mkdir -p release-apks
          mv composeApp/build/outputs/apk/release/*-arm64-v8a-release.apk release-apks/Linkora-arm64-v8a-release.apk
          mv composeApp/build/outputs/apk/release/*-armeabi-v7a-release.apk release-apks/Linkora-armeabi-v7a-release.apk
          mv composeApp/build/outputs/apk/release/*-x86_64-release.apk release-apks/Linkora-x86_64-release.apk
          mv composeApp/build/outputs/apk/release/*-universal-release.apk release-apks/Linkora-universal-release.apk

      - name: Upload Android Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            preview-apks/*.apk
            release-apks/*.apk

  build-wasm:
    name: Build WasmJs Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Build WasmJs Distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Remove unused generated Compose resources
        run: rm -rf "composeApp/build/dist/wasmJs/productionExecutable/composeResources/com.composables.composeunstyled_platformtheme.generated.resources"

      - name: Build WasmJs Extension Zip
        run: |
          cd composeApp/build/dist/wasmJs/productionExecutable
          zip -r $GITHUB_WORKSPACE/Linkora-web-wasm.zip .

      - name: Upload Web Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            Linkora-web-wasm.zip

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy \
          --dir=composeApp/build/dist/wasmJs/productionExecutable \
          --prod \
          --message "Production deploy for tag ${{ inputs.tag }}"